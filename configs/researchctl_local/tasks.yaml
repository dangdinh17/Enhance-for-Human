schema_version: '1.0'
tasks:
  unit_tests:
    executor: host
    argv:
    - '{runtime.python}'
    - -B
    - -m
    - unittest
    - discover
    - -s
    - tests
    timeout_seconds: 600
    max_output_gb: 2
    network: deny
    resources:
      gpu_count: 0
      shared_memory: true
  verify_sources:
    executor: host
    argv:
    - '{runtime.python}'
    - -B
    - scripts/researchctl_adapter.py
    - sources
    - --output
    - '{trial.output_dir}/task_result.json'
    timeout_seconds: 900
    max_output_gb: 10
    network: deny
    resources:
      gpu_count: 0
    collectors:
    - type: result_json
      path: '{trial.output_dir}/task_result.json'
    result_contract:
      path: '{trial.output_dir}/task_result.json'
      scope: preparation
  data_smoke:
    executor: host
    argv:
    - '{runtime.python}'
    - -B
    - scripts/researchctl_adapter.py
    - data_smoke
    - --output
    - '{trial.output_dir}/task_result.json'
    timeout_seconds: 1800
    max_output_gb: 5
    network: deny
    resources:
      gpu_count: 0
    collectors:
    - type: result_json
      path: '{trial.output_dir}/task_result.json'
    result_contract:
      path: '{trial.output_dir}/task_result.json'
      scope: smoke
  prepare_qp22:
    executor: host
    argv:
    - '{runtime.python}'
    - -B
