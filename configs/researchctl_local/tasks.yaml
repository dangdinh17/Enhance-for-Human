    - -B
    - scripts/researchctl_adapter.py
    - train_smoke
    - --config
    - '{trial.config}'
    - --output
    - '{trial.output_dir}/task_result.json'
    timeout_seconds: 3600
    max_output_gb: 10
    network: deny
    resources:
      gpu_count: 1
      gpu: 0
      shared_memory: true
    collectors:
    - type: result_json
      path: '{trial.output_dir}/task_result.json'
    result_contract:
      path: '{trial.output_dir}/task_result.json'
      scope: smoke
      primary_metric: true
    outputs:
      required:
      - '{trial.model_run_dir}/DONE.json'
      - '{trial.model_run_dir}/checkpoints/best.pth'
      - '{trial.model_run_dir}/checkpoints/last.pt'
  train_window:
