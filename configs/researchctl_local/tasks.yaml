    collectors:
    - type: result_json
      path: '{trial.output_dir}/task_result.json'
    result_contract:
      path: '{trial.output_dir}/task_result.json'
      scope: preparation
    writable_paths:
    - '{paths.outputs}/datasets/mfqev2_qp22_v1'
  verify_dataset:
