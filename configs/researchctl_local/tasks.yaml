    network: comet
    resources:
      gpu_count: 1
      gpu: 0
      shared_memory: true
    collectors:
    - type: result_json
      path: '{trial.output_dir}/task_result.json'
    result_contract:
      path: '{trial.output_dir}/task_result.json'
      scope: training
      primary_metric: true
    outputs:
      required:
      - '{trial.model_run_dir}/DONE.json'
