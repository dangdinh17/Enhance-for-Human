schema_version: '1.0'
pipeline:
  stages:
  - id: preflight
    kind: campaign
    task: unit_tests
  - id: dataset
    purpose: preparation
    kind: campaign
    task: verify_dataset
  - id: smoke
    purpose: smoke
    kind: trials
    task: train_window_smoke
  - id: main
    kind: trials
    task: train_window
    requires_approval: true
  - id: evaluate
    purpose: evaluation
    kind: trials
    uses: main
    task: evaluate_window
  - id: aggregate
    kind: campaign
    task: aggregate
