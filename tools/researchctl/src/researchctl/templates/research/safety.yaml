schema_version: "1.0"
execution: {shell_commands_allowed: false, kill_process_group_on_timeout: true}
filesystem:
  dataset_read_only: true
  allow_proc_runtime: true
  writable_roots: [runs/research, outputs/research]
  forbidden_write_paths: [.git, data, .research/safety.yaml]
network: {default: deny, comet_tasks: [train]}
approval: {required_stages: [main]}
publication: {automatic_submission: false, require_human_approval: true}
