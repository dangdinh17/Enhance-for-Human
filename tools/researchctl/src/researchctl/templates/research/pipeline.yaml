schema_version: "1.0"
pipeline:
  stages:
    - {id: preflight, kind: campaign, task: unit_tests}
    - {id: smoke, kind: trials, task: train}
    - {id: tuning, kind: trials, task: train}
    - {id: main, kind: trials, task: train, requires_approval: true}
    - {id: evaluate, purpose: evaluation, kind: trials, task: evaluate, uses: main}
    - {id: aggregate, kind: campaign, task: aggregate}
