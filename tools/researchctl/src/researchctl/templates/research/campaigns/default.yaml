schema_version: "1.0"
campaign: {id: default, title: Default controlled experiment, seeds: [7]}
variants:
  - {id: baseline, base_config: configs/experiment.yaml}
matrix: {}
allowed_change_scope: [experiment.name, experiment.random_seed, paths.run_root, train.num_iter]
bindings:
  experiment.name: experiment
  paths.run_root: "{trial.output_dir}"
dataset_manifests: []
stages:
  preflight: {enabled: true}
  smoke: {enabled: true, max_trials: 1, overrides: {train.num_iter: 2}}
  tuning: {enabled: true, overrides: {train.num_iter: 1000}}
  main: {enabled: true}
selection: {source_stage: tuning, max_trials: 1}
