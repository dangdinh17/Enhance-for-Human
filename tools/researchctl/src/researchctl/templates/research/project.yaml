schema_version: "1.0"
project: {id: portable_ml_project, title: Portable ML Project, domain: machine_learning}
runtime:
  python: python
  environment: {PYTHONUNBUFFERED: "1", OMP_NUM_THREADS: "2", MKL_NUM_THREADS: "2", OPENBLAS_NUM_THREADS: "2"}
paths:
  datasets: data
  runs: runs/research
  outputs: outputs/research
  temp: runs/research/.tmp
  required: []
provenance:
  include: ["src/**/*.py", "scripts/**/*.py", "configs/**/*.yaml"]
comet: {enabled: true, api_key_env: COMET_API_KEY}
