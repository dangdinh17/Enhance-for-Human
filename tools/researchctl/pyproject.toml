[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchctl"
version = "0.2.1"
description = "Config-driven, resumable research experiment orchestration"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
researchctl = "researchctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchctl = ["templates/research/*.yaml", "templates/research/campaigns/*.yaml", "templates/research/profiles/*.yaml", "templates/research/prompts/*.md"]

