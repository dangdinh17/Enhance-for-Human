schema_version: '1.0'
project:
  runtime:
    python: python
    environment:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
  paths:
    required:
    - data/bundle.json
    - data/bundle_verified.json
    - data/manifests
    - data/shared/prepared/stdr_lmdb
  comet:
    enabled: false
resources:
  resources:
    max_parallel_nodes: 1
    default_gpu: 0
    stop_before_disk_full_gb: 4
execution:
  max_stage: smoke
