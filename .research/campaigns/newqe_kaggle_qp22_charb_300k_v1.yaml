schema_version: '1.0'
matrix: {}
config_contract:
  seed: seed
  name: name
  run_dir: run_dir
allowed_change_scope:
- seed
- name
- run_dir
- train.iterations
- train.validate_every
- train.checkpoint_every
- train.validation_max_samples
- dataset.workers
bindings:
  run_dir: '{trial.output_dir}/experiment'
  name: '{trial.variant}_{trial.id}'
dataset_manifests:
- data/dataset_contract.json
- data/bundle.json
- data/manifests/QP22.json
selection:
  source_stage: smoke
  mode: all
variants:
- id: qp22
  seeds:
  - 29
  base_config: configs/kaggle/QP22.yml
stages:
  smoke:
    overrides:
      train.iterations: 2
      train.validate_every: 2
      train.checkpoint_every: 1
      train.validation_max_samples: 8
      dataset.workers: 0
  main:
    bindings:
      run_dir: runs/research/newqe_kaggle_qp22_charb_300k_v1/QP22
pipeline:
- id: dataset
  purpose: preparation
  kind: campaign
  task: portable_verify
- id: smoke
  purpose: smoke
  kind: trials
  task: portable_gpu_smoke
- id: main
  kind: trials
  task: portable_train
  requires_approval: true
campaign:
  id: newqe_kaggle_qp22_charb_300k_v1
  title: 'New QE Kaggle QP22: Charbonnier, best PSNR-Y'
